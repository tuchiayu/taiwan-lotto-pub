name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint & Format Check
        shell: bash
        run: |
          ruff format --check .
          ruff check .

      - name: Dependency Audit
        shell: bash
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

      - name: Install Test Browser
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Run Tests
        shell: bash
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Upload Browser Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  pre-commit-check:
    name: Pre-commit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Pre-commit Hooks
        shell: bash
        run: pipx run pre-commit run --all-files

  ci-check:
    name: ci-check
    runs-on: ubuntu-latest
    needs: [python-check, pre-commit-check]
    if: always()
    steps:
      - name: Evaluate Results
        shell: bash
        run: |
          RESULT_PROJECT="${{ needs.python-check.result }}"
          RESULT_PRE_COMMIT="${{ needs.pre-commit-check.result }}"

          if [ "$RESULT_PROJECT" = "failure" ] || [ "$RESULT_PROJECT" = "cancelled" ]; then
            echo "Python check failed or was cancelled."
            exit 1
          fi

          if [ "$RESULT_PRE_COMMIT" = "failure" ] || [ "$RESULT_PRE_COMMIT" = "cancelled" ]; then
            echo "Pre-commit check failed or was cancelled."
            exit 1
          fi

          echo "Python check passed."
